name: Feature request
description: Propose a focused improvement to BSSID Picker.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem before proposing an implementation. Do not include unredacted SSIDs, BSSIDs, scan exports, credentials, or other private network data.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and documentation for this request.
          required: true
        - label: I removed private network and credential information from this request.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to accomplish, and why is the current behavior insufficient?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the user-visible result rather than only an implementation.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: textarea
    id: privacy
    attributes:
      label: Privacy, permissions, and compatibility
      description: Note any new data storage, network access, macOS permission, private API, or minimum-version impact.
    validations:
      required: true
