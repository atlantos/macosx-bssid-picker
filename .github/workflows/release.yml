name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag and architecture
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'Release tag must use the form vMAJOR.MINOR.PATCH: %s\n' \
              "$GITHUB_REF_NAME" >&2
            exit 1
          fi

          tag_type="$(/usr/bin/git cat-file -t "refs/tags/$GITHUB_REF_NAME")"
          if [[ "$tag_type" != tag ]]; then
            printf 'Release ref must be an annotated tag: %s\n' \
              "$GITHUB_REF_NAME" >&2
            exit 1
          fi

          tagged_commit="$(/usr/bin/git rev-parse 'HEAD^{commit}')"
          tag_reference_commit="$(/usr/bin/git rev-parse \
            "refs/tags/$GITHUB_REF_NAME^{commit}")"
          if [[ "$tag_reference_commit" != "$tagged_commit" ]]; then
            printf 'Release tag changed after this workflow was triggered.\n' >&2
            exit 1
          fi
          if ! /usr/bin/git merge-base --is-ancestor \
              "$tagged_commit" refs/remotes/origin/main; then
            printf 'Release tag must point to a commit on origin/main.\n' >&2
            exit 1
          fi

          tag_version="${GITHUB_REF_NAME#v}"
          plist_version="$(/usr/libexec/PlistBuddy \
            -c 'Print :CFBundleShortVersionString' App/Info.plist)"
          if [[ "$plist_version" != "$tag_version" ]]; then
            printf 'Release tag version %s does not match Info.plist version %s.\n' \
              "$tag_version" "$plist_version" >&2
            exit 1
          fi

          runner_arch="$(/usr/bin/uname -m)"
          if [[ "$runner_arch" != "$EXPECTED_ARCH" ]]; then
            printf 'Runner architecture %s does not match expected architecture %s.\n' \
              "$runner_arch" "$EXPECTED_ARCH" >&2
            exit 1
          fi

      - name: Validate sources and metadata
        shell: bash
        run: |
          set -euo pipefail

          /bin/bash -n BuildTools/build-app.sh
          /bin/bash -n BuildTools/create-release.sh
          /bin/bash -n BuildTools/run-tests.sh
          /bin/bash -n BuildTools/setup-local-signing.sh
          /bin/bash -n Tests/create-release-tests.sh
          /usr/bin/plutil -lint App/Info.plist App/BSSIDPicker.entitlements
          /usr/bin/xcrun swift-format lint --recursive --strict App Tests

          empty_tree_hash="$(/usr/bin/git hash-object -t tree /dev/null)"
          /usr/bin/git diff --check "$empty_tree_hash" HEAD

          /usr/bin/xcrun clang \
            -std=c11 \
            -Wall \
            -Wextra \
            -Werror \
            -Wno-deprecated-declarations \
            -fsyntax-only \
            BuildTools/signing-key-helper.c

      - name: Run regression tests
        shell: bash
        run: |
          set -euo pipefail

          export BSSID_PICKER_SDK_PATH
          BSSID_PICKER_SDK_PATH="$(/usr/bin/xcrun --sdk macosx --show-sdk-path)"
          ./BuildTools/run-tests.sh

      - name: Build with an ad-hoc signature
        shell: bash
        env:
          BSSID_PICKER_SIGNING_IDENTITY: "-"
        run: |
          set -euo pipefail

          export BSSID_PICKER_SDK_PATH
          BSSID_PICKER_SDK_PATH="$(/usr/bin/xcrun --sdk macosx --show-sdk-path)"
          ./BuildTools/build-app.sh

      - name: Package and verify release archive
        id: package
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          readonly app_path="build/BSSID Picker.app"
          readonly release_dir="$RUNNER_TEMP/release"
          readonly archive="$release_dir/BSSID-Picker-${GITHUB_REF_NAME}-macos-${EXPECTED_ARCH}.zip"
          extract_root="$(/usr/bin/mktemp -d "$RUNNER_TEMP/bssid-picker-release.XXXXXX")"
          readonly extract_root
          trap '/bin/rm -rf "$extract_root"' EXIT

          verify_bundle() {
            local bundle="$1"
            local executable="$bundle/Contents/MacOS/BSSIDPicker"
            local actual_archs
            local entitlement
            local entitlement_report
            local signature_details
            local bundle_version

            [[ -x "$executable" ]] || {
              printf 'Release executable not found: %s\n' "$executable" >&2
              return 1
            }

            actual_archs="$(/usr/bin/lipo -archs "$executable")"
            if [[ "$actual_archs" != "$EXPECTED_ARCH" ]]; then
              printf 'Release executable has architecture %s; expected only %s.\n' \
                "$actual_archs" "$EXPECTED_ARCH" >&2
              return 1
            fi

            /usr/bin/codesign --verify --deep --strict --verbose=2 "$bundle"
            signature_details="$(/usr/bin/codesign \
              --display --verbose=4 "$bundle" 2>&1)"
            if ! printf '%s\n' "$signature_details" | \
                /usr/bin/grep -Fqx 'Signature=adhoc'; then
              printf 'Release bundle does not have an ad-hoc signature.\n' >&2
              return 1
            fi
            if printf '%s\n' "$signature_details" | \
                /usr/bin/grep -q '^Authority='; then
              printf 'Ad-hoc release unexpectedly contains a signing authority.\n' >&2
              return 1
            fi

            entitlement_report="$(/usr/bin/codesign \
              --display --entitlements - "$bundle" 2>&1)"
            for entitlement in \
                com.apple.security.app-sandbox \
                com.apple.security.files.user-selected.read-write \
                com.apple.security.network.client \
                com.apple.security.personal-information.location; do
              if ! printf '%s\n' "$entitlement_report" | \
                  /usr/bin/awk -v expected="$entitlement" '
                    /^[[:space:]]*\[Key\][[:space:]]/ {
                      current = $0
                      sub(/^[[:space:]]*\[Key\][[:space:]]*/, "", current)
                      next
                    }
                    current == expected &&
                      $0 ~ /^[[:space:]]*\[Bool\][[:space:]]+true[[:space:]]*$/ {
                      found = 1
                    }
                    END { exit found ? 0 : 1 }
                  '; then
                printf 'Release bundle is missing enabled entitlement: %s\n' \
                  "$entitlement" >&2
                return 1
              fi
            done

            bundle_version="$(/usr/libexec/PlistBuddy \
              -c 'Print :CFBundleShortVersionString' \
              "$bundle/Contents/Info.plist")"
            if [[ "v$bundle_version" != "$GITHUB_REF_NAME" ]]; then
              printf 'Packaged app version %s does not match release tag %s.\n' \
                "$bundle_version" "$GITHUB_REF_NAME" >&2
              return 1
            fi
          }

          verify_bundle "$app_path"
          /bin/mkdir -p "$release_dir"
          /usr/bin/ditto -c -k --keepParent "$app_path" "$archive"
          [[ -s "$archive" ]] || {
            printf 'Release archive was not created: %s\n' "$archive" >&2
            exit 1
          }

          /usr/bin/ditto -x -k "$archive" "$extract_root"
          entry_count="$(/usr/bin/find "$extract_root" -mindepth 1 -maxdepth 1 \
            -print | /usr/bin/wc -l | /usr/bin/tr -d '[:space:]')"
          if [[ "$entry_count" != 1 ]]; then
            printf 'Release archive must contain exactly one top-level entry.\n' >&2
            exit 1
          fi
          verify_bundle "$extract_root/BSSID Picker.app"

          printf 'archive=%s\n' "$archive" >>"$GITHUB_OUTPUT"

      - name: Attest release archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          create-storage-record: false
          subject-path: ${{ steps.package.outputs.archive }}

      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.arch }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Confirm tracked files are unchanged
        shell: bash
        run: /usr/bin/git diff --exit-code -- .

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out triggering source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Download release archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Validate assets and create checksums
        shell: bash
        run: |
          set -euo pipefail

          readonly arm64_archive="BSSID-Picker-${GITHUB_REF_NAME}-macos-arm64.zip"
          readonly intel_archive="BSSID-Picker-${GITHUB_REF_NAME}-macos-x86_64.zip"

          [[ -s "dist/$arm64_archive" ]] || {
            printf 'Missing Apple silicon release archive: %s\n' "$arm64_archive" >&2
            exit 1
          }
          [[ -s "dist/$intel_archive" ]] || {
            printf 'Missing Intel release archive: %s\n' "$intel_archive" >&2
            exit 1
          }

          asset_count="$(find dist -maxdepth 1 -type f -name '*.zip' \
            -printf '.' | wc -c | tr -d '[:space:]')"
          if [[ "$asset_count" != 2 ]]; then
            printf 'Expected exactly two ZIP release assets; found %s.\n' \
              "$asset_count" >&2
            exit 1
          fi

          cd dist
          sha256sum "$arm64_archive" "$intel_archive" >SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Confirm release tag still targets this build
        shell: bash
        run: |
          set -euo pipefail

          expected_commit="$(git rev-parse 'HEAD^{commit}')"
          remote_commit="$(git ls-remote origin \
            "refs/tags/$GITHUB_REF_NAME^{}" | awk 'NF { print $1; exit }')"
          if [[ -z "$remote_commit" || "$remote_commit" != "$expected_commit" ]]; then
            printf 'Release tag no longer targets the commit that was built.\n' >&2
            exit 1
          fi

      - name: Publish release
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh release create "$GITHUB_REF_NAME" \
            "dist/BSSID-Picker-${GITHUB_REF_NAME}-macos-arm64.zip#Apple silicon (arm64)" \
            "dist/BSSID-Picker-${GITHUB_REF_NAME}-macos-x86_64.zip#Intel (x86_64)" \
            "dist/SHA256SUMS#SHA-256 checksums" \
            --verify-tag \
            --title "BSSID Picker $GITHUB_REF_NAME" \
            --generate-notes \
            --notes $'> [!WARNING]\n> These binaries use an ad-hoc signature and are not notarized by Apple. macOS may require explicit approval in System Settings > Privacy & Security before first launch.\n\nBuild provenance is available through GitHub artifact attestations.'
